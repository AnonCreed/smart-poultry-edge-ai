; ============================================================================
; PlatformIO configuration for the Poultry Telemetry edge node.
;
; Target: ESP32 DevKit V1 (30-pin, 2x15 socket) -- the module drawn in the
; KiCad schematic. The Arduino framework is used for portability with the
; DHT sensor and ArduinoJson libraries; a future migration to ESP-IDF plus
; TensorFlow Lite Micro can reuse the same pinout and payload contract.
; ============================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Standard USB-serial baud on the CP2102/CH340 bridges shipped with the
; DevKit V1 variants; matches the Serial.begin() call in main.cpp.
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4

; CORE_DEBUG_LEVEL=3 -> INFO. Drop to 0 for release builds; raise to 4/5 for
; verbose HTTP client / WiFi diagnostics when a link is flaky in the field.
build_flags =
    -DCORE_DEBUG_LEVEL=3
