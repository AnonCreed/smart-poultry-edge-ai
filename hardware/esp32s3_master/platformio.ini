; ============================================================================
; PlatformIO project configuration for the ESP32-S3 master node.
;
; Board: YD-ESP32-S3 (2022 v1.3) -- compatible with esp32-s3-devkitc-1
; Role : Receives SensorPacket over ESP-NOW from the sensor ESP32,
;        POSTs the combined record to Django, and sends the classification
;        back to the sensor node as an ActuatorCommand.
; ============================================================================
[env:esp32s3_master]
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino

; USB CDC on-board (native USB on the YD-ESP32-S3). If your board uses the
; UART bridge chip instead, change upload_port to the UART port (e.g. /dev/ttyUSB0)
; and remove the build_flags below.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

monitor_speed  = 115200
upload_speed   = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    spaziochirale/Chirale_TensorFLowLite @ ^2.0.0
